  # Employee App crew code (/j/) and email invite (/i/) links, served from
  # orbitsworks.com and opened by the real app (com.orbitworks.app). The dev
  # site sets its own values in apphosting.orbitworks_dev.yaml.
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://orbitsworks.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: JOIN_APP_SCHEME
    value: "orbitsworks"
    availability:
      - BUILD
      - RUNTIME
  - variable: JOIN_APP_NAME
    value: "OrbitsWorks"
    availability:
      - BUILD
      - RUNTIME
  - variable: JOIN_APP_INSTALL_FROM
    value: "the App Store"
    availability:
      - BUILD
      - RUNTIME
  - variable: JOIN_APP_INSTALL_URL
    value: "https://apps.apple.com/app/id6801155800"
    availability:
      - BUILD
      - RUNTIME
  # Universal links: /.well-known/apple-app-site-association lists the real
  # app only.
  - variable: APP_LINKS_IOS_APP_IDS
    value: "6ZU7MHT284.com.orbitworks.app"
    availability:
      - BUILD
      - RUNTIME
  # Android App Links (/.well-known/assetlinks.json, app 1.1.6+): the real
  # app and its Play App signing key (Play Console > App integrity > App
  # signing). Not the upload key - Play re-signs every install with this one.
  - variable: APP_LINKS_ANDROID_PACKAGE
    value: "com.orbitworks.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: APP_LINKS_ANDROID_SHA256
    value: "0D:02:E0:A4:7B:DE:B8:BE:FA:2F:9B:37:E0:60:B6:4E:27:D6:07:47:CA:73:63:F7:2F:43:3B:2C:08:38:F6:A9"
    availability:
      - BUILD
      - RUNTIME
  # Task 5 Kiosk mode (K3): ON on prod since 11/27 (app 1.1.6 in the App Store)
  # (functions/.env.orbitworks-7ef59 KIOSK_ENABLED=true too).
  - variable: NEXT_PUBLIC_KIOSK_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
